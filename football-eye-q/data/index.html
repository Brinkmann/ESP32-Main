<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEQ-HUB</title>
    <link rel="stylesheet" href="/styles/app_styles.css" />
    <link rel="icon" type="image/x-icon" href="/assets/app_icon.ico" />
  </head>
  <body>
    <nav class="top-nav">
      <h1>Football EyeQ</h1>
    </nav>

    <div id="session-page">
      <div class="menu-settings-container">
        
        <div class="test-button-container">
          <label for="test-network-toggle">Test All Nodes</label>
          <input type="checkbox" class="slider-toggle" id="test-network-toggle" />
        </div>
        <h2>Enter Session Code</h2>
        <div class="session-input-group">
            <input type="text" id="session-code-input" maxlength="10" placeholder="e.g. 010512" />
        </div>
        <button id="session-submit-btn">Load Session</button>
        <p id="session-error" class="session-error-text"></p>
      </div>
    </div>

    <div id="patterns-page" style="display: none">
      <div id="table-container"></div>
      <button id="new-session-btn" class="nav-button">New Session</button>
      <div id="speed-controls" class="speed-controls">
        <h2>Pattern Speed</h2>
        <div class="speed-button-group">
          <button type="button" class="speed-button" data-speed="0.5">0.5</button>
          <button type="button" class="speed-button active" data-speed="1">1.0</button>
          <button type="button" class="speed-button" data-speed="1.5">1.5</button>
          <button type="button" class="speed-button" data-speed="2">2.0</button>
        </div>
        <p id="speed-feedback" class="speed-feedback">Speed: Standard</p>
      </div>
    </div>

    <script src="/logic/actions.js"></script>
  </body>
</html>
